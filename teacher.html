<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EDUVERSE Teacher Dashboard." />
  <meta name="theme-color" content="#111936" />
  <title>EDUVERSE — Dashboard Guru</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👩‍🏫%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/teacher.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="teacher-app">
  <a href="#dashboard" class="sr-only">Langsung ke dashboard</a>
  <div id="dashboard" role="application" aria-label="EDUVERSE Teacher Dashboard"></div>
  <div id="teacher-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--deep-space,#111936);color:#F7F9FF;font-family:'Nunito Sans',system-ui,sans-serif;z-index:9999;transition:opacity .3s ease;">
    <div style="text-align:center">
      <div style="font-size:3.5rem;margin-bottom:12px">👩‍🏫</div>
      <div style="font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:700">Dashboard Guru</div>
      <div style="font-size:.85rem;opacity:.7;margin-top:6px">Memuat analitik…</div>
    </div>
  </div>
  <script type="module">
    import app from './js/core/app.js';
    import { state } from './js/core/state.js';
    import { auth } from './js/core/auth.js';
    import teacherLogin from './js/screens/teacherLogin.js';
    import teacherDashboard from './js/screens/teacherDashboard.js';

    async function boot() {
      const loader = document.getElementById('teacher-loader');
      const host = document.getElementById('dashboard');

      try {
        // Boot data siswa & app terlebih dahulu
        await app.boot();

        // ── AUTH GATE ────────────────────────────────
        // Jika belum login, tampilkan form login dulu.
        if (!auth.isLoggedIn()) {
          teacherLogin.render(host);
          if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 320); }
          return;
        }

        // Sudah login → tampilkan dashboard
        teacherDashboard.render(host);
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(() => { if (loader.parentNode) loader.remove(); }, 320);
        }

        const user = state.getPath('user');
        if (user?.name) document.title = `EDUVERSE Guru — ${user.name}`;
      } catch (err) {
        console.error('[EDUVERSE Teacher] Boot failed:', err);
        if (loader) loader.innerHTML = `<div style="text-align:center;max-width:560px;padding:24px">
          <div style="font-size:3rem">⚠️</div>
          <div style="font-weight:700;margin:12px 0">Dashboard gagal dimuat</div>
          <p style="opacity:.75;font-size:.9rem;line-height:1.5">${String(err.message || err)}</p>
          <button onclick="location.reload()" style="margin-top:16px;padding:10px 22px;border-radius:12px;border:0;background:#7C5CFC;color:#fff;font-weight:700;cursor:pointer">Muat Ulang</button>
        </div>`;
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  </script>
  <noscript><div style="padding:32px;color:#F7F9FF;background:#111936;font-family:sans-serif">
    <h1>Dashboard Guru membutuhkan JavaScript</h1><p>Aktifkan JavaScript untuk melihat analitik kelas.</p>
  </div></noscript>
</body>
</html>
